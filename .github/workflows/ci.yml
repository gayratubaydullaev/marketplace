name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GO_SERVICES: auth catalog search cart orders payments vendor reviews notifications analytics media realtime delivery

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      # CI must never call live payment providers.
      PAYMENTS_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Download modules
        run: |
          (cd packages/go-common && go mod tidy)
          for s in $GO_SERVICES; do
            (cd services/$s && go mod tidy)
          done
      - name: Build services
        run: |
          for s in $GO_SERVICES; do
            (cd services/$s && go build -o /tmp/$s ./cmd/server)
          done
      - name: Validate payment-provider mode
        env:
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          PAYME_SECRET: ${{ secrets.PAYME_SECRET }}
        run: |
          if [[ "$PAYMENTS_SANDBOX" == "false" ]] && { [[ -z "${STRIPE_SECRET:-}" ]] || [[ -z "${PAYME_SECRET:-}" ]]; }; then
            echo "Live payments require STRIPE_SECRET and PAYME_SECRET" >&2
            exit 1
          fi
      - name: Test
        run: |
          (cd packages/go-common && go test ./...)
          for s in $GO_SERVICES; do
            if find "services/$s" -name '*_test.go' | grep -q .; then
              (cd services/$s && go test ./...)
            fi
          done
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd packages/go-common && govulncheck ./...)
          for s in $GO_SERVICES; do
            (cd services/$s && govulncheck ./...)
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=critical
      - name: Lint
        run: pnpm lint
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.E2E_ENABLED == 'true' }}
    env:
      E2E: "1"
      PAYMENTS_SANDBOX: "true"
      STOREFRONT_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Install Playwright Chromium
        run: pnpm --filter @gayrat/storefront exec playwright install --with-deps chromium
      - name: Start storefront
        run: pnpm --filter @gayrat/storefront build && pnpm --filter @gayrat/storefront start &
      - name: Wait for storefront
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/uz >/dev/null && exit 0
            sleep 2
          done
          echo "storefront did not become ready" >&2
          exit 1
      - name: Playwright smoke
        run: pnpm --filter @gayrat/storefront test:e2e

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Pin to commit SHA (v0.36.0). Tag 0.28.0 was removed after the 2026
        # trivy-action supply-chain incident; prefer v-prefixed tags or SHAs.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
