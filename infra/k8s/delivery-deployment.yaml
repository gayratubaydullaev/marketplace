apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery
          image: gayrat/delivery-service:latest
          ports:
            - containerPort: 8013
          env:
            - name: HTTP_PORT
              value: "8013"
          envFrom:
            - configMapRef:
                name: marketplace-config
            - secretRef:
                name: marketplace-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8013
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: marketplace
spec:
  selector:
    app: delivery-service
  ports:
    - port: 8013
      targetPort: 8013
