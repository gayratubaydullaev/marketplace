{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName | default "vault-backend" }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | quote }}
      path: {{ .Values.externalSecrets.vault.kvPath | default "secret" | quote }}
      version: {{ .Values.externalSecrets.vault.version | default "v2" | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vault.kubernetesMount | default "kubernetes" | quote }}
          role: {{ .Values.externalSecrets.vault.role | default "marketplace" | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.vault.serviceAccount | default "external-secrets" | quote }}
            namespace: {{ .Values.externalSecrets.vault.serviceAccountNamespace | default "external-secrets" | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: marketplace-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName | default "vault-backend" }}
    kind: {{ .Values.externalSecrets.storeKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: redis_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: jwt_secret
    - secretKey: JWT_PRIVATE_KEY_PEM
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: jwt_private_key_pem
    - secretKey: JWT_PUBLIC_KEY_PEM
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: jwt_public_key_pem
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: minio_access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: minio_secret_key
    - secretKey: PAYME_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: payme_secret
    - secretKey: PAYME_MERCHANT_ID
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: payme_merchant_id
    - secretKey: CLICK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: click_secret
    - secretKey: CLICK_MERCHANT_ID
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: click_merchant_id
    - secretKey: UZUM_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: uzum_secret
    - secretKey: STRIPE_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: stripe_secret
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: stripe_webhook_secret
    - secretKey: CENTRIFUGO_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: centrifugo_secret
    - secretKey: KAFKA_BROKERS
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: kafka_brokers
{{- end }}
